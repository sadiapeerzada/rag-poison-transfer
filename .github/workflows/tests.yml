name: Tests

on:
  push:
    branches:
      - main
      - week7-8-rcd
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml rank-bm25 numpy sentence-transformers datasets

      - name: Check Python compilation
        run: |
          python -m compileall -q run.py src tests

      - name: Check whitespace errors
        run: git diff --check

      - name: Run test suite
        run: python -m pytest -q
